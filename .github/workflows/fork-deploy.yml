name: Fork - Deploy Image

# `main` is a pure mirror of upstream main; `deploy` (the default branch) is
# upstream main plus this fork's patches. On a schedule, on a manual run and on
# every push to `deploy`, upstream main is fetched, mirrored to `main`, merged
# into `deploy`, and the result is published as ghcr.io/benjitobz/bookbridge:deploy
# when anything changed. A push to `deploy` itself is always built.
#
# Pushing merged workflow files needs more than the built-in GITHUB_TOKEN allows.
# Add a PAT with `repo` + `workflow` scope as the SYNC_TOKEN secret; without it
# the run fails only when upstream changed a file under .github/workflows/.

on:
  push:
    branches: [deploy]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if deploy did not change'
        required: false
        type: boolean
        default: false

concurrency:
  group: fork-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/benjitobz/bookbridge
  UPSTREAM_URL: https://github.com/cporcellijr/bookbridge.git

jobs:
  sync:
    name: Merge upstream into deploy
    if: github.repository == 'benjitobz/bookbridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.sync.outputs.build }}
      sha: ${{ steps.sync.outputs.sha }}
      short_sha: ${{ steps.sync.outputs.short_sha }}
      version: ${{ steps.sync.outputs.version }}
    steps:
      - name: Checkout deploy
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync, merge and decide
        id: sync
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet --tags upstream main

          # main: hard mirror of upstream, never edited on this fork
          git push --quiet --force origin upstream/main:refs/heads/main \
            || echo "::warning::Could not mirror upstream main to origin/main (a SYNC_TOKEN secret is needed when upstream changed a workflow file)."

          before="$(git rev-parse HEAD)"
          if ! git merge --no-edit upstream/main; then
            {
              echo "### Merge failed"
              echo
              echo "Merging upstream main into \`deploy\` hit a conflict. Resolve it locally:"
              echo '```'
              echo "git fetch upstream && git checkout deploy && git merge upstream/main"
              echo "# fix conflicts, then: git push origin deploy"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          after="$(git rev-parse HEAD)"

          if [ "$before" != "$after" ]; then
            if ! git push --quiet origin deploy; then
              echo "::error::Pushing the merge to deploy was refused. If the merge touched .github/workflows/, add a SYNC_TOKEN secret (PAT with repo + workflow scope)."
              exit 1
            fi
          fi

          human_push=false
          if [ "$EVENT_NAME" = push ] && [ "$HEAD_AUTHOR" != 'github-actions[bot]' ]; then
            human_push=true
          fi
          build=false
          if [ "$before" != "$after" ] || [ "$FORCE_BUILD" = true ] || [ "$human_push" = true ]; then
            build=true
          fi

          base="$(git describe --tags --abbrev=0 --match 'v*' upstream/main 2>/dev/null || echo v0.0.0)"
          short="$(git rev-parse --short "$after")"
          {
            echo "build=$build"
            echo "sha=$after"
            echo "short_sha=$short"
            echo "version=${base#v}+deploy.$short"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### deploy"
            echo
            echo "| Upstream merged | Build | Commit | Version |"
            echo "| --- | --- | --- | --- |"
            echo "| $([ "$before" != "$after" ] && echo yes || echo no) | $build | \`$short\` | \`${base#v}+deploy.$short\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:deploy
            ${{ env.IMAGE }}:deploy-${{ needs.sync.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/benjitobz/bookbridge
            org.opencontainers.image.revision=${{ needs.sync.outputs.sha }}
            org.opencontainers.image.version=${{ needs.sync.outputs.version }}
          cache-from: type=gha,scope=fork-deploy
          cache-to: type=gha,mode=max,scope=fork-deploy
          build-args: |
            APP_VERSION=${{ needs.sync.outputs.version }}
            INSTALL_GPU=false
