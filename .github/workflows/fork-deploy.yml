name: Fork - Deploy Image

# The `deploy` branch is upstream `main` plus this fork's patches. Whenever the
# fork's `main` moves (GitHub "Sync fork"), `main` is merged into `deploy` and the
# result is published as ghcr.io/benjitobz/bookbridge:deploy. A push to `deploy`
# itself is built as-is.
#
# Merging `main` can touch files under .github/workflows/, which the built-in
# GITHUB_TOKEN may not push. Add a PAT with `repo` + `workflow` scope as the
# SYNC_TOKEN secret to cover that case; without it the merge push fails only
# when upstream changed a workflow file.

on:
  push:
    branches: [main, deploy]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if deploy did not change'
        required: false
        type: boolean
        default: false

concurrency:
  group: fork-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/benjitobz/bookbridge
  UPSTREAM_URL: https://github.com/cporcellijr/bookbridge.git

jobs:
  sync:
    name: Merge main into deploy
    if: github.repository == 'benjitobz/bookbridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.sync.outputs.build }}
      sha: ${{ steps.sync.outputs.sha }}
      short_sha: ${{ steps.sync.outputs.short_sha }}
      version: ${{ steps.sync.outputs.version }}
    steps:
      - name: Checkout deploy
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge and decide
        id: sync
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet --tags upstream main

          before="$(git rev-parse HEAD)"
          if ! git merge --no-edit origin/main; then
            {
              echo "### Merge failed"
              echo
              echo "Merging the fork's \`main\` into \`deploy\` hit a conflict. Resolve it locally:"
              echo '```'
              echo "git checkout deploy && git merge main"
              echo "# fix conflicts, then: git push origin deploy"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          after="$(git rev-parse HEAD)"

          if [ "$before" != "$after" ]; then
            if ! git push --quiet origin deploy; then
              echo "::error::Pushing the merge to deploy was refused. If the merge touched .github/workflows/, add a SYNC_TOKEN secret (PAT with repo + workflow scope)."
              exit 1
            fi
          fi

          human_push_to_deploy=false
          if [ "$EVENT_NAME" = push ] && [ "$EVENT_REF" = refs/heads/deploy ] && [ "$HEAD_AUTHOR" != 'github-actions[bot]' ]; then
            human_push_to_deploy=true
          fi
          build=false
          if [ "$before" != "$after" ] || [ "$FORCE_BUILD" = true ] || [ "$human_push_to_deploy" = true ]; then
            build=true
          fi

          base="$(git describe --tags --abbrev=0 --match 'v*' upstream/main 2>/dev/null || echo v0.0.0)"
          short="$(git rev-parse --short "$after")"
          {
            echo "build=$build"
            echo "sha=$after"
            echo "short_sha=$short"
            echo "version=${base#v}+deploy.$short"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### deploy"
            echo
            echo "| Merged main | Build | Commit | Version |"
            echo "| --- | --- | --- | --- |"
            echo "| $([ "$before" != "$after" ] && echo yes || echo no) | $build | \`$short\` | \`${base#v}+deploy.$short\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:deploy
            ${{ env.IMAGE }}:deploy-${{ needs.sync.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/benjitobz/bookbridge
            org.opencontainers.image.revision=${{ needs.sync.outputs.sha }}
            org.opencontainers.image.version=${{ needs.sync.outputs.version }}
          cache-from: type=gha,scope=fork-deploy
          cache-to: type=gha,mode=max,scope=fork-deploy
          build-args: |
            APP_VERSION=${{ needs.sync.outputs.version }}
            INSTALL_GPU=false
